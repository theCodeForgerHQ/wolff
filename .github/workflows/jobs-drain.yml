name: jobs-drain

# Optional since 2026-08-23: the demo's scheduled jobs come from QStash
# schedules (QSTASH_SCHEDULES, `pnpm --filter @wolff/api schedules:sync`;
# docs/phase-2.md). This stays for a deployment with a BullMQ queue on
# Redis and no worker: run it by hand, or add back a schedule such as
#   schedule:
#     - cron: '0 * * * *'
on:
  workflow_dispatch:

concurrency:
  group: jobs-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c4f8ef6a9e88ffd8b66b8d1b3c75c5e5b24 # v4.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated into packages/database/src/generated,
      # which is not committed; the worker imports it.
      - name: Generate the Prisma client
        run: pnpm db:generate

      - name: Drain queues
        run: pnpm --filter @wolff/api worker:drain
        env:
          # Production mode: webhooks must be https and may not target
          # private addresses (the SSRF guard is relaxed in development).
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Decrypts per-workspace webhook signing secrets.
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
