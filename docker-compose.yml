version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:0.8.2-pg17 # Postgres 17 + pgvector
    container_name: wolff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wolff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wolff_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-wolff}
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    ports:
      # Bug #158: Bind to localhost only to prevent network exposure
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wolff']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ queues and rate-limit counters
  redis:
    image: redis:7-alpine
    container_name: wolff-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --maxmemory-policy noeviction

  # Mailpit for email testing in development
  # NOTE: Dev-only — do NOT use in production. Insecure auth is enabled for local testing.
  mailpit:
    image: axllent/mailpit:latest
    container_name: wolff-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025' # Web UI
      - '127.0.0.1:1025:1025' # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1 # Dev-only: accept any SMTP credentials
      MP_SMTP_AUTH_ALLOW_INSECURE: 1 # Dev-only: allow plaintext auth

volumes:
  postgres17_data:

networks:
  default:
    name: wolff-network
