[project]
name = "wolff-ai"
version = "0.1.0"
description = "AI service: retrieval, quote drafting, MCP server and reports"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.142.1",
    "httpx2==2.13.1",
    "langchain==1.4.3",
    "mcp==2.2.0",
    "langchain-openai==1.6.6",
    "langchain-text-splitters==1.1.3",
    "openai==3.22.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-sdk==1.45.0",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pyjwt==2.15.1",
    "redis==8.1.0",
    "sentry-sdk[fastapi]==2.71.0",
    "sqlalchemy[asyncio]==2.1.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pandas-stubs==3.0.5.260914",
    "types-openpyxl==3.1.5.20260827",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.14.0",
    "pytest-cov==7.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH"]
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# SQL strings in the eval scripts read better unwrapped.
"evals/**" = ["E501", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "isolation: cross-tenant isolation suite",
    "eval: eval runs against recorded fixtures",
]
